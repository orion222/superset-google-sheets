[project]
name = "sqllab_gsheets"
version = "1.0.0"
license = "Apache-2.0"
description = "Export SQL Lab query results to Google Sheets"
dependencies = [
    "apache-superset-core>=0.1.0",
    "google-auth>=2.0.0",
    "google-api-python-client>=2.0.0",
    "pandas>=1.0.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "flask>=2.3"]

[tool.apache_superset_extensions.build]
include = [
    "src/michael_s_molina/sqllab_gsheets/**/*.py",
]
exclude = []
